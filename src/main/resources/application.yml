spring:
    datasource:
        url: "jdbc:postgresql://localhost:5432/postgres"
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
        hikari:
            pool-name: LakeHikariPool
            maximum-pool-size: 10
            minimum-idle: 5
            idle-timeout: 30000
            max-lifetime: 1800000
            connection-timeout: 30000
            leak-detection-threshold: 2000
            validation-timeout: 5000
    jpa:
        hibernate:    
        show-sql: true
        properties: 
            hibernate:
              batch_fetch_style: DYNAMIC
              query:
                optimizer:
                    enabled: true
                    tracking-depth: 3
                    max-batch-size: 50
                    adaptive-batch: true
                    relation_aware_loading: true
        
    security:
        user:
           name: user
           password: user
    codec:
        max-in-memory-size: 16MB
    threads:
        virtual:
            enabled: true
    logging:
        structured:
            format:
                console: ecs
                file: ecs